# enemy_color: "red"
enemy_color: "red"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 130
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 150
nis_thresh: 0.4 # 默认 NIS 失败比例阈值
outpost_nis_thresh: 0.7 # 前哨站 NIS 阈值
lost_timeout: 0.5 # s, dt 超过此值才判 lost
outpost_w_clamp: 2.51 # rad/s, 前哨站 sign(w) 锁定后的钳位幅值

#####-----aimer参数-----#####
yaw_offset: 0.0 # degree -2.5
pitch_offset: -5.1 # degree 2
# 已回退选板锁定，迭代重选板时 cmd 会有 ~9° 跳变，coming/leaving 维持 70/25
comming_angle: 70 # degree
leaving_angle: 25 # degree
outpost_coming_angle: 90 # degree, 前哨站专属
outpost_leaving_angle: 50 # degree, 前哨站专属
decision_speed: 5 # rad/s
# delay_time = vision 链路延迟 + 发射延迟（实测发射延迟 ~60ms + vision ~70ms = 0.13s）
# 慢/高速小陀螺都验证 0.13 命中准，统一保持
high_speed_delay_time: 0.10 # s
low_speed_delay_time: 0.10 # s

#####-----shooter参数-----#####
# 已回退选板锁定，cmd 会有 ~9° 跳变；平移稳态滞后 ~4°
# 容差恢复到 6/4.5 容纳 cmd 跳变 + 滞后
first_tolerance: 6.0 # 近距离射击容差，degree
second_tolerance: 4.5 # 远距离射击容差，degree
judge_distance: 5 # m, 距离判断阈值（5m 内全用 first 的更宽容差）
auto_fire: true # 是否由自瞄控制射击
cmd_stable_window: 5 # shooter cmd 稳态窗口（帧），抑制高速小陀螺 cmd 跳变带来的喷水
cmd_stable_thresh: 4.0 # degree, 窗口内 cmd 最大跳变阈值

camera_name: "hikrobot"
exposure_ms: 6.0
gain: 16
vid_pid: "2bdf:0001"

# -1  0  0
#  0 -1  0
#  0  0  1
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]


# 重投影误差: 0.0361px
camera_matrix: [1786.8881360647817, 0, 784.41065002247103, 0, 1786.3149600895799, 604.3898766531504, 0, 0, 1]
distort_coeffs: [-0.077073698353657488, 0.12866284212734441, 0.001987642017210143, 0.0010992544106552991, 0]


# 相机同理想情况的偏角: yaw-0.80 pitch-0.92 roll0.70 degree
# 标定板到世界坐标系原点的水平距离: 2.70 m
# 标定板同竖直摆放时的偏角: yaw21.43 pitch0.35 roll-0.31 degree
R_camera2gimbal: [0.013764569009212746, -0.01620967800951062, 0.9997738659210984, -0.99983055667644471, 0.011999135395222071, 0.01395989562418011, -0.012222707394905885, -0.99979661286113342, -0.016041768460596434]
t_camera2gimbal: [0.068848991457727118, -0.0154911971975004, 0.085253974002182265]
#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
record_serial_raw: true # 串口字节级 raw dump 开关，开启后写入 records/<时间戳>_rx.bin / _tx.bin
record_video: true # 视频+四元数录制开关，写入 records/<时间戳>.avi / .txt
record_signals: true # 是否把 EKF/cmd/Tracker 等中间量写 records/*.jsonl

#####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]

#####-----buff_detector参数-----#####
detect:
  contrast: 1
  brightness: 
    blue: -120
    red: -100
  brightness_threshold:
    blue: 120
    red: 40
  morphology_size:
    blue: 3
    red: 3
  dilate_size: 2
  # canny_low_threshold: 100
  # canny_high_threshold: 180
  # approx_epsilon: 1.0
  R_contours_min_area: 200
  R_contours_max_area: 600
  fanblades_head_contours_min_area: 3000
  fanblades_head_contours_max_area: 8000
  fanblades_body_contours_min_area: 1000
  fanblades_body_contours_max_area: 4000
  standard_fanblade_path: ./assets/standard_fanblade.jpg

#####-----buff_aimer参数-----#####
aim_time: 0.150         # s
wait_time: 0.300        # s
command_fire_gap: 0.080 # s
predict_time: 0.150     # s
