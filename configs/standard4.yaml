enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 4 # degree -2.5
pitch_offset: 6.5 # degree 2
comming_angle: 70 # degree
leaving_angle: 25 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.155 # s
low_speed_delay_time: 0.155 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 4.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.1820px
camera_matrix: [1785.4881526822305, 0, 672.4806478241826, 0, 1785.026019470562, 559.89603224794314, 0, 0, 1]
distort_coeffs: [-0.076005079619881746, 0.11182817466388446, 0.0005362204787722057, -0.0027546300984895122, 0]

# 相机同理想情况的偏角: yaw1.44 pitch-7.28 roll0.96 degree
# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw7.61 pitch13.92 roll-0.46 degree
R_camera2gimbal: [-0.027182119030230909, -0.12616154330853446, 0.99163723074269183, -0.99949106557517331, 0.019998323121329122, -0.024853106601381177, -0.016695575474690555, -0.99180811252093692, -0.12664093215554434]
t_camera2gimbal: [0.13160669975045827, 0.10377721766577375, 0.024908271912914642]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
#####-----录制开关-----#####
# 三类录制各自独立开关，文件名前缀共用同一个进程级时间戳，便于四类文件互相对齐。
record_video: true # 视频+四元数 → records/<时间戳>.avi + .txt（缺省 true）
record_signals: true # EKF/cmd/tracker 等调试量 → records/<时间戳>_signals.jsonl（缺省 false）
record_serial_raw: false # 上下位机串口字节流 → records/<时间戳>_rx.bin / _tx.bin（缺省 false）
record_video_fps: 30 # 视频抽帧率。相机跑得比这快时会丢帧，于是视频帧数少于 signals
                     # 行数——对齐必须用 .txt 里的时间戳，不能用帧序号。

# signals 分频：按 key 分档，不是按行分档。
# 未列进 signals_low_keys 的 key 每帧都写（EKF 状态、cmd、云台反馈必须留在全速档，
# 抖动/收敛分析都是逐帧算的）；列进去的按 signals_low_rate_hz 限流。
# 低频 key 在多数行里缺席（不是 0，是没这个键），离线用 pandas ffill() 还原：
#   df = pd.read_json("records/xxx_signals.jsonl", lines=True).ffill()
# signals_low_rate_hz 设 0 表示低频 key 只写一次（适合整场不变的量）。
# 不配这两项 = 全部信号全速 = 与分频功能加入之前行为一致。
signals_low_rate_hz: 5 # Hz
signals_low_keys:
  - tracker_state
  - bullet_speed
  - bullet_count
  - P_x
  - P_y
  - P_z
  - P_r
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s