# enemy_color: "red"
enemy_color: "red"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 130
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
nis_thresh: 0.4 # 默认 NIS 失败比例阈值
outpost_nis_thresh: 0.7 # 前哨站 NIS 阈值
lost_timeout: 0.5 # s, dt 超过此值才判 lost
outpost_w_clamp: 2.51 # rad/s, 前哨站 sign(w) 锁定后的钳位幅值

#####-----aimer参数-----#####
yaw_offset: -1.4 # degree -2.5
pitch_offset: -6.1 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
outpost_coming_angle: 90 # degree, 前哨站专属
outpost_leaving_angle: 50 # degree, 前哨站专属
decision_speed: 8 # rad/s
high_speed_delay_time: 0.12 # s
low_speed_delay_time: 0.12 # s

#####-----shooter参数-----#####
first_tolerance: 3.0 # 近距离射击容差，degree（放宽换弹频）
second_tolerance: 2.0 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 5.2
gain: 16
vid_pid: "2bdf:0001"

# -1  0  0
#  0 -1  0
#  0  0  1
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.0513px
camera_matrix: [1812.7187940233898, 0, 716.77722602292272, 0, 1813.9170878916034, 531.27540375777176, 0, 0, 1]
distort_coeffs: [-0.075748997556277536, 0.17102137948561694, -0.0026576597806768345, 8.9252321148684962e-05, 0]

# 相机同理想情况的偏角: yaw-0.47 pitch+0.40 roll-0.78 degree
# 标定方法: 134 张样本，按 PnP 残差 <0.10px 过滤后用 104 张做手眼
R_camera2gimbal: [0.0080202911243691943, 0.0071128789601545006, 0.99994253929072285, -0.99987541920875489, -0.013537937869659178, 0.0081160520176972173, 0.013594888465783328, -0.99988305875794059, 0.0070034146291273469]
t_camera2gimbal: [0.17500359454911704, 0.088750848350715325, -0.29473109428642902]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
record_serial_raw: false # 串口字节级 raw dump 开关，开启后写入 records/<时间戳>_rx.bin / _tx.bin
record_signals: false # 是否把 EKF/cmd/Tracker 等中间量写 records/*.jsonl

#####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]

#####-----buff_detector参数-----#####
detect:
  contrast: 1
  brightness: 
    blue: -120
    red: -100
  brightness_threshold:
    blue: 120
    red: 40
  morphology_size:
    blue: 3
    red: 3
  dilate_size: 2
  # canny_low_threshold: 100
  # canny_high_threshold: 180
  # approx_epsilon: 1.0
  R_contours_min_area: 200
  R_contours_max_area: 600
  fanblades_head_contours_min_area: 3000
  fanblades_head_contours_max_area: 8000
  fanblades_body_contours_min_area: 1000
  fanblades_body_contours_max_area: 4000
  standard_fanblade_path: ./assets/standard_fanblade.jpg

#####-----buff_aimer参数-----#####
aim_time: 0.150         # s
wait_time: 0.300        # s
command_fire_gap: 0.080 # s
predict_time: 0.150     # s
