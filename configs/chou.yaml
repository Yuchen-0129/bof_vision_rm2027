enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.7
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 150
nis_thresh: 0.4 # 默认 NIS 失败比例阈值
outpost_nis_thresh: 0.7 # 前哨站 NIS 阈值
lost_timeout: 0.5 # s, dt 超过此值才判 lost
outpost_w_clamp: 2.51 # rad/s, 前哨站 sign(w) 锁定后的钳位幅值

#####-----aimer参数-----#####
yaw_offset: -1.5 # degree 大 向左
pitch_offset: 1 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
outpost_coming_angle: 90 # degree, 前哨站专属
outpost_leaving_angle: 50 # degree, 前哨站专属
decision_speed: 7 # rad/s
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.015 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击
cmd_stable_window: 5 # shooter cmd 稳态窗口（帧），抑制高速小陀螺 cmd 跳变带来的喷水
cmd_stable_thresh: 4.0 # degree, 窗口内 cmd 最大跳变阈值

camera_name: "hikrobot"
exposure_ms: 1.8
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.0494px
camera_matrix: [2409.5933593253999, 0, 684.51363747448102, 0, 2409.2601621899366, 579.44282642969983, 0, 0, 1]
distort_coeffs: [-0.021142893494732879, 0.15060843507183075, 0.00061781649405433529, -0.0023288034747822421, 0]

# 相机同理想情况的偏角: yaw-2.14 pitch-0.35 roll0.43 degree
# 标定板到世界坐标系原点的水平距离: 2.84 m
# 标定板同竖直摆放时的偏角: yaw-11.60 pitch3.39 roll2.58 degree
R_camera2gimbal: [0.037244641788761829, -0.00634788953624329, 0.99928601559136354, -0.99927840424693293, 0.0072187730557723984, 0.037290214819343498, -0.0074503331288171956, -0.99995379573958565, -0.0060744483094964819]
t_camera2gimbal: [0.054021697689499139, 0.084792406352141594, 0.055746584510609321]




#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
record_serial_raw: false # 串口字节级 raw dump 开关，开启后写入 records/<时间戳>_rx.bin / _tx.bin
record_video: true # 视频+四元数录制开关，写入 records/<时间戳>.avi / .txt
record_signals: false # 是否把 EKF/cmd/Tracker 等中间量写 records/*.jsonl
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s



