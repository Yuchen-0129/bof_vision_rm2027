# 棋盘格内角点数（pattern_cols x pattern_rows）
pattern_cols: 11
pattern_rows: 8
square_size_mm: 30
preview_scale: 0.5
detect_interval: 2

R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

camera_name: "hikrobot"
exposure_ms: 3
gain: 10.0
vid_pid: "2bdf:0001"

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"

# 运行 calibrate_camera_chessboard 后将 camera_matrix / distort_coeffs 填回此处
camera_matrix: [1, 0, 0, 0, 1, 0, 0, 0, 1]
distort_coeffs: [0, 0, 0, 0, 0]
