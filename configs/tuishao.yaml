enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 130
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 150
nis_thresh: 0.4 # 默认 NIS 失败比例阈值
outpost_nis_thresh: 0.7 # 前哨站 NIS 阈值
lost_timeout: 0.5 # s, dt 超过此值才判 lost
outpost_w_clamp: 2.51 # rad/s, 前哨站 sign(w) 锁定后的钳位幅值

#####-----aimer参数-----#####
yaw_offset: -1.2 # degree -2.5
pitch_offset: -1.5 # degree 2
# 已回退选板锁定，迭代重选板时 cmd 会有 ~9° 跳变，coming/leaving 维持 70/25
comming_angle: 70 # degree
leaving_angle: 25 # degree
outpost_coming_angle: 90 # degree, 前哨站专属
outpost_leaving_angle: 50 # degree, 前哨站专属
decision_speed: 10 # rad/s
# 老 yaml 实测调好的 delay（腿哨硬件链路比 standard4 短，发射延迟更小）
# 实测 EKF a 比真实超前 10°+，配合此 delay 可平衡使 cmd 落点接近真实板
high_speed_delay_time: 0.031 # s
low_speed_delay_time: 0.021 # s

#####-----shooter参数-----#####
# 已回退选板锁定，cmd 会有 ~9° 跳变；平移稳态滞后 ~4°
# 容差恢复到 6/4.5 容纳 cmd 跳变 + 滞后
first_tolerance: 6.0 # 近距离射击容差，degree
second_tolerance: 4.5 # 远距离射击容差，degree
judge_distance: 5 # m, 距离判断阈值（5m 内全用 first 的更宽容差）
auto_fire: true # 是否由自瞄控制射击
cmd_stable_window: 5 # shooter cmd 稳态窗口（帧），抑制高速小陀螺 cmd 跳变带来的喷水
cmd_stable_thresh: 4.0 # degree, 窗口内 cmd 最大跳变阈值

camera_name: "hikrobot"
exposure_ms: 4.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.0403px
camera_matrix: [1786.3093795666086, 0, 731.694719817536, 0, 1786.6269129347747, 544.57984296117775, 0, 0, 1]
distort_coeffs: [-0.077216449300797699, 0.13339205971014592, -0.00090298910811975651, 0.0038833033646343989, 0]

# 相机同理想情况的偏角: yaw-0.78 pitch0.95 roll3.15 degree
R_camera2gimbal: [0.014507808471760253, 0.015770603982998233, 0.99977037940887126, -0.99837987618790047, 0.055246929298626846, 0.01361615313167952, -0.055019508507251569, -0.99834816815231553, 0.016546565520871415]
t_camera2gimbal: [0.089564689968893538, -0.039055679848717592, 0.12475032835510791]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
record_serial_raw: false # 串口字节级 raw dump 开关，开启后写入 records/<时间戳>_rx.bin / _tx.bin
record_video: true # 视频+四元数录制开关，写入 records/<时间戳>.avi / .txt
record_signals: true # 是否把 EKF/cmd/Tracker 等中间量写 records/*.jsonl
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
