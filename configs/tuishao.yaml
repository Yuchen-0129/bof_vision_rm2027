enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -1.2 # degree -2.5
pitch_offset: 1.5 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 10 # rad/s
high_speed_delay_time: 0.031 # s
low_speed_delay_time: 0.021 # s

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 4.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.0417px
camera_matrix: [1796.2912458227815, 0, 716.38146256259927, 0, 1795.5298070051419, 569.94007542690395, 0, 0, 1]
distort_coeffs: [-0.073668060976507188, 0.13630248008715129, 0.0020748851902263219, 0.0018692470846480074, 0]

# 相机同理想情况的偏角: yaw-1.35 pitch-1.77 roll1.15 degree
# 标定板到世界坐标系原点的水平距离: 3.20 m
# 标定板同竖直摆放时的偏角: yaw-16.37 pitch11.85 roll0.64 degree
R_camera2gimbal: [0.022870333415778377, -0.031279346328319163, 0.99924899316572968, -0.99953824375633737, 0.01928620115473445, 0.023480666803047799, -0.020006176994812608, -0.99932459438277221, -0.030823821044121746]
t_camera2gimbal: [0.068641282076963517, -0.012503974229716277, 0.083227364936890605]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
